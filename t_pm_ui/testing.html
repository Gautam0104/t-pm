<body class="">
    <button class="btn btn-primary d-flex align-items-center border-0 " id="moveAutomation">
        <i class="fas fa-arrow-right me-2"></i> Move card to..
    </button>


    <div class="modal fade " id="moveCardToModal" tabindex="-1" aria-modal="true" role="dialog">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="text-center">Edit Button</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="d-flex align-items-center mb-2">
                        <label class="form-label me-3">Icon</label>
                        <label class="form-label me-3">Title</label>
                    </div>
                    <div class="d-flex align-items-center">
                        <div
                            class="icon-placeholder me-2 d-flex align-items-center justify-content-center border rounded p-2 bg-light">
                            <i class="fas fa-arrow-right"></i>
                        </div>
                        <input type="text" class="form-control" id="titleInput" placeholder="Move card to...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Actions</label>
                        <div class="border p-3">
                            <strong>Move</strong>
                            <div>
                                Move the card to
                                <select id="positionSelect1" class="form-select d-inline w-auto m-3">
                                    <option value="">Select Position</option>
                                    <option value="top">Top</option>
                                    <option value="bottom">Bottom</option>
                                </select>
                                of the list
                                <select id="listSelect" class="form-select d-inline w-auto m-3">
                                    <option value="">Select List</option>
                                    <option value="todo">todo</option>
                                    <option value="inprogress">inprogress</option>
                                    <option value="for-approval">for-approval</option>
                                    <option value="rejected">rejected</option>
                                    <option value="approved">approved</option>
                                    <option value="Copy new test">Copy new test</option>
                                </select>
                                on
                                <select id="boardSelect" class="form-select d-inline w-auto m-3">
                                    <option value="">Select Board</option>
                                    <option value="board1">Main Board</option>
                                    <option value="board2">Secondary Board</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-light w-100" id="addActionButton">+ Add action</button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary w-100" id="saveButton" disabled="">Add Button</button>
                </div>
                <p class="message" id="message"></p>
            </div>
        </div>
    </div>



    <script>
        document.getElementById('moveAutomation').addEventListener('click', function () {

            let modal = new bootstrap.Modal(document.getElementById('moveCardToModal'));
            modal.show();
        });
    </script>
